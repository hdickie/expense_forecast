<VirtualHost *:80>
    ServerName expense_forecast.localhost

    # Redirect /login to Fief for authentication
    #Redirect /login http://fief.localhost/authorize?client_id=_EKEqlT8iLXsr4lE9UbokooFxXORsj2AelqPv0q9Bu0&redirect_uri=http%3A%2F%2Fapi.localhost%2Fauth%2Fcallback&response_type=code&scope=openid%20email%20profile
    Redirect /login http://api.localhost/login

    Redirect /logout http://api.localhost/logout

    # Document root for static frontend files
    DocumentRoot /usr/local/apache2/htdocs

    <Directory /usr/local/apache2/htdocs>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /usr/local/apache2/logs/error.log
    CustomLog /usr/local/apache2/logs/access.log combined
</VirtualHost>
