services:
  api:
    build: 
      context: ./backend
    expose:
      - "8001"
    environment:
      - UVICORN_PORT=8001
      - FIEF_DOMAIN=http://fief.localhost
      - FIEF_INTERNAL_DOMAIN=http://fief:8000
      - FIEF_CLIENT_ID=_EKEqlT8iLXsr4lE9UbokooFxXORsj2AelqPv0q9Bu0
      - FIEF_CLIENT_SECRET=DR63yfZCDvVrKa4qp4_JjOEhIrNcZEITXxlxdM5Xvqs
       - CELERY_BROKER_URL=redis://redis:6379/0 
    # command: /bin/sh -c "sleep 10 && (uvicorn main:app --host 0.0.0.0 --port 8001 --reload &) && sleep 15 && alembic upgrade head && wait"
    command: /bin/sh -c "sleep 10 && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8001"

      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolalloworiginlist=http://expense_forecast.localhost"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowheaders=Content-Type"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowcredentials=true"  

      - "traefik.http.routers.api.middlewares=api-cors"
    # depends_on:
    #   fief:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "sleep", "15"]
      # test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      # interval: 5s
      # timeout: 3s
      # retries: 20
      
  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_PASSWORD=fief
      - POSTGRES_USER=fief
      - POSTGRES_DB=fief
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

  traefik:
    image: "traefik:v2.11"
    container_name: "traefik"
    command:
      # Uncomment the lines below to debug and try with a self-signed certificate
      # - "--log.level=DEBUG"
      # - "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@mydomain.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"

    ports:
      - "443:443"
      - "80:80" 
      - "8080:8080"
    volumes:
      - "letsencrypt-data:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      
  fief:
    image: ghcr.io/fief-dev/fief:latest
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.fief.rule=Host(`fief.localhost`)"
        - "traefik.http.routers.fief.entrypoints=web"
        - "traefik.http.routers.fief-secure.rule=Host(`fief.localhost`)"
        - "traefik.http.routers.fief-secure.entrypoints=websecure"
        - "traefik.http.routers.fief-secure.tls=true"
    command: >
      sh -c "
        fief run-server
      "
    environment:
       - FIEF__DATABASE_URL=postgresql://fief:fief@postgres:5432/fief
    # healthcheck:
    #   test: ["CMD", "sleep", "10"]
    #   # test: ["CMD", "curl", "-f", "http://localhost:8000/.well-known/openid-configuration"]
    #   # interval: 5s
    #   # timeout: 5s
    #   # retries: 20

  fief-worker:
    image: ghcr.io/fief-dev/fief:latest
    command: fief run-worker -p 1 -t 1
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    environment:
       - FIEF__DATABASE_URL=postgresql://fief:fief@postgres:5432/fief

  apache:
    build:
      context: ./frontend
    expose:
      - "8080"
    volumes:
      - ./frontend/public-html/:/usr/local/apache2/htdocs/
      - ./frontend/apache-config/my-site.conf:/usr/local/apache2/conf.d/my-site.conf
      - ./frontend/apache-config/httpd.conf:/usr/local/apache2/conf/httpd.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`expense_forecast.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  celery:
    build: 
      context: ./backend
    command: celery -A celery_main worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api

  migrate:
    build: ./backend
    # depends_on:
    #   api:
    #     condition: service_healthy
    entrypoint: >
      sh -c "sleep 15 && alembic upgrade head"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    restart: "no"


volumes:
  redis-data:
  postgres-data:
  letsencrypt-data: